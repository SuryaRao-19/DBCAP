{% extends "base.html" %}
{% block title %}Error {{ code }} - EV ChargeNet{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 4rem; font-weight: 900; color: var(--accent-rose); margin-bottom: 0.5rem;">{{ code }}</div>
    <h2>{{ message }}</h2>
    <p style="color: var(--text-muted); margin: 1rem 0 2rem;">Please navigate back to the dashboard or contact your system administrator if this issue persists.</p>
    <a href="/" class="btn btn-primary">Return to Safety</a>
  </div>
</div>
{% endblock %}
