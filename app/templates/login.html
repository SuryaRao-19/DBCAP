{% extends "base.html" %}
{% block title %}Sign In - EV Charging Station Management{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 1rem;">⚡</div>
      <h2>Welcome Back</h2>
      <p class="page-subtitle">Sign in to manage charging stations or reserve slots</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
